<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050d1c"/>
      <stop offset="0.5" stop-color="#0b1e38"/>
      <stop offset="1" stop-color="#16305a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#e3c66b" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#c9a227" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#0b1e38" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b1e38" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.78">
      <stop offset="0.65" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- fine field grid -->
  <g stroke="#ffffff" stroke-opacity="0.028" stroke-width="1">
    <line x1="0" y1="120" x2="1920" y2="120"/>
    <line x1="0" y1="240" x2="1920" y2="240"/>
    <line x1="0" y1="360" x2="1920" y2="360"/>
    <line x1="0" y1="480" x2="1920" y2="480"/>
    <line x1="0" y1="600" x2="1920" y2="600"/>
    <line x1="0" y1="720" x2="1920" y2="720"/>
    <line x1="0" y1="840" x2="1920" y2="840"/>
    <line x1="0" y1="960" x2="1920" y2="960"/>
    <line x1="120" y1="0" x2="120" y2="1080"/>
    <line x1="240" y1="0" x2="240" y2="1080"/>
    <line x1="360" y1="0" x2="360" y2="1080"/>
    <line x1="480" y1="0" x2="480" y2="1080"/>
    <line x1="600" y1="0" x2="600" y2="1080"/>
    <line x1="720" y1="0" x2="720" y2="1080"/>
    <line x1="840" y1="0" x2="840" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1080" y1="0" x2="1080" y2="1080"/>
    <line x1="1200" y1="0" x2="1200" y2="1080"/>
    <line x1="1320" y1="0" x2="1320" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
    <line x1="1560" y1="0" x2="1560" y2="1080"/>
    <line x1="1680" y1="0" x2="1680" y2="1080"/>
    <line x1="1800" y1="0" x2="1800" y2="1080"/>
  </g>

  <!-- orbital rings: world / opportunity motif -->
  <g fill="none" stroke="#e3c66b">
    <circle cx="1450" cy="290" r="330" stroke-opacity="0.08" stroke-width="1"/>
    <circle cx="1450" cy="290" r="238" stroke-opacity="0.13" stroke-width="1"/>
    <circle cx="1450" cy="290" r="156" stroke-opacity="0.2" stroke-width="1.2"/>
    <circle cx="1450" cy="290" r="86" stroke-opacity="0.3" stroke-width="1.6"/>
  </g>

  <!-- connection nodes -->
  <g fill="#c9a227">
    <rect x="1446" y="-44" width="8" height="8" rx="1.5" fill-opacity="0.85"/>
    <rect x="1768" y="276" width="8" height="8" rx="1.5" fill-opacity="0.6"/>
    <rect x="1120" y="348" width="8" height="8" rx="1.5" fill-opacity="0.6"/>
    <rect x="1370" y="90" width="8" height="8" rx="1.5" fill-opacity="0.6"/>
    <rect x="1610" y="170" width="8" height="8" rx="1.5" fill-opacity="0.45"/>
    <rect x="1290" y="556" width="8" height="8" rx="1.5" fill-opacity="0.85"/>
    <rect x="146" y="470" width="8" height="8" rx="1.5" fill-opacity="0.5"/>
    <rect x="840" y="220" width="8" height="8" rx="1.5" fill-opacity="0.4"/>
  </g>

  <!-- dotted route lines between nodes -->
  <g stroke="#e3c66b" fill="none" stroke-dasharray="2 12" stroke-linecap="round">
    <path d="M 150 470 L 660 330 L 960 260 L 1220 220" stroke-opacity="0.22" stroke-width="1.4"/>
    <path d="M 1220 220 L 1450 162" stroke-opacity="0.3" stroke-width="1.4"/>
    <path d="M 1124 352 L 1280 420 L 1670 330" stroke-opacity="0.16" stroke-width="1.4"/>
    <path d="M 1450 620 L 1450 550 L 1600 330" stroke-opacity="0.18" stroke-width="1.4"/>
  </g>

  <!-- layered contour terrain (lower half) -->
  <g fill="none" stroke="#e3c66b">
    <path d="M -40 760 C 320 700, 660 830, 1040 740 S 1700 620, 1960 700" stroke-opacity="0.14" stroke-width="1.4"/>
    <path d="M -40 832 C 280 790, 620 900, 1000 820 S 1660 720, 1960 800" stroke-opacity="0.1" stroke-width="1.3"/>
    <path d="M -40 900 C 320 870, 700 950, 1080 900 S 1720 810, 1960 870" stroke-opacity="0.07" stroke-width="1.2"/>
    <path d="M -40 968 C 420 930, 780 1020, 1240 962 S 1780 900, 1960 940" stroke-opacity="0.05" stroke-width="1.1"/>
  </g>

  <!-- low horizon accent -->
  <line x1="0" y1="722" x2="1920" y2="722" stroke="#c9a227" stroke-opacity="0.14" stroke-width="1"/>

  <!-- darkening haze + vignette for text legibility -->
  <rect width="1920" height="1080" fill="url(#haze)"/>
  <rect width="1920" height="1080" fill="url(#vig)"/>
</svg>